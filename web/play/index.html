<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SatTap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="app">
  <header id="top">
    <div class="row">
      <a class="brand" href="/" aria-label="SatTap home">SatTap</a>
      <div id="roundLabel" class="round">Loading…</div>
      <div id="runningScore" class="mono score-mini" aria-label="Total score">0</div>
    </div>
    <div id="progress" class="progress" aria-hidden="true"></div>
    <div id="notice" class="notice" hidden></div>
  </header>

  <section id="crop" class="crop">
    <button id="cropBtn" class="crop-btn" aria-label="Enlarge satellite image">
      <img id="cropImg" alt="Satellite image. Where is this?">
    </button>
    <div class="chips">
      <span id="chipBand" class="chip mono"></span>
      <span id="chipSat" class="chip mono"></span>
    </div>
    <div id="hintBox" class="hint-box" hidden aria-hidden="true"></div>
    <button id="hintBtn" class="chip hint-btn" type="button">Hint · wider view (−30%)</button>
    <span id="chipMeta" class="chip chip-meta mono"></span>
  </section>

  <section id="mapWrap" class="map-wrap">
    <div id="map">
      <canvas id="globe" tabindex="0" role="application"
        aria-label="Globe. Drag to spin, pinch or scroll to zoom, tap to place your guess. Arrow keys spin, plus and minus zoom, Enter places a pin at the centre."></canvas>
    </div>
    <div id="mapHint" class="map-hint">Drag to spin · pinch to zoom · tap to pin</div>
    <div class="map-ctrl" role="group" aria-label="Globe zoom">
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
      <button id="zoomReset" type="button" aria-label="Reset view">&#x2316;</button>
    </div>
    <div class="map-credit">Land: Natural Earth</div>
  </section>

  <section id="result" class="result" hidden aria-live="polite">
    <div>
      <div class="label mono">Distance</div>
      <div id="resDist" class="big">0 km</div>
    </div>
    <div class="right">
      <div class="label mono">Score</div>
      <div class="big accent"><span id="resScore">0</span><span class="of"> / 100</span></div>
    </div>
    <p id="resQuip" class="quip" aria-live="polite"></p>
  </section>

  <footer id="bar" class="bar">
    <button id="actionBtn" class="primary" disabled>Lock in</button>
  </footer>
</main>

<div id="lightbox" class="lightbox" hidden>
  <button id="lightboxClose" class="lightbox-close" aria-label="Close">&times;</button>
  <div class="lightbox-scroll"><img id="lightboxImg" alt="Enlarged satellite image"></div>
</div>

<div id="summary" class="summary" hidden>
  <div class="summary-card">
    <div class="label mono" id="sumDate"></div>
    <div class="total"><span id="sumTotal">0</span><span class="of"> / <span id="sumMax">500</span></span></div>
    <p id="sumQuip" class="quip quip-sum"></p>
    <ol id="sumList" class="sum-list"></ol>
    <div class="stats" aria-label="Your stats on this device">
      <div><strong id="stStreak">0</strong><span>day streak</span></div>
      <div><strong id="stGames">0</strong><span>played</span></div>
      <div><strong id="stAvg">0</strong><span>avg</span></div>
      <div><strong id="stBest">0</strong><span>best</span></div>
    </div>
    <section id="board" class="board" hidden>
      <div class="label mono">Today's leaderboard</div>
      <div id="boardYou" class="board-you"></div>
      <ol id="boardList" class="board-list"></ol>
      <div class="board-foot">Playing as <span id="boardName"></span> <button id="rerollBtn" class="link" type="button">new name</button></div>
    </section>
    <button id="copyBtn" class="primary">Copy result</button>
    <button id="reviewBtn" class="ghost">Review rounds</button>
  </div>
</div>

<script src="/vendor/d3-array.min.js"></script>
<script src="/vendor/d3-geo.min.js"></script>
<script src="/globe.js"></script>
<script src="/app.js"></script>
</body>
</html>
