<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="A daily game: five crops of real GOES satellite imagery. Where on Earth is this?">
<title>SatTap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/landing.css">
</head>
<body class="landing">
<main class="home">
  <section class="hero" aria-label="GOES-West full disk">
    <div class="disk" id="disk">
      <img id="diskImg" alt="Looping satellite animation of the Earth as seen by GOES-West: the Pacific Ocean and the Americas." width="720" height="720" hidden>
      <div class="disk-fallback" aria-hidden="true"></div>
    </div>
    <div class="chips">
      <span class="chip mono" id="chipSat">GOES-West</span>
      <span class="chip mono" id="chipTime"></span>
    </div>
  </section>

  <section class="panel">
    <div class="brand-row">
      <span class="brand-mark">SatTap</span>
      <span class="mono dim" id="dateLabel"></span>
    </div>
    <h1>Where on Earth is this?</h1>
    <p class="lede">Five crops of real satellite imagery. Drop a pin, get scored on distance. A new puzzle every day.</p>

    <a id="startBtn" class="cta" href="/play/">Start today's challenge</a>
    <p id="startNote" class="start-note mono"></p>

    <section class="board" id="board" aria-live="polite">
      <div class="board-head">
        <h2 class="label mono">Today's leaderboard</h2>
        <span class="mono dim" id="boardCount"></span>
      </div>
      <ol id="boardList" class="board-list"></ol>
      <p id="boardEmpty" class="board-empty" hidden></p>
    </section>

    <p class="credit">Imagery: NOAA GOES ABI GeoColor, courtesy of CIRA and NOAA. Meteosat imagery: &copy; EUMETSAT.</p>
  </section>
</main>
<script src="/landing.js"></script>
</body>
</html>
