name: Daily puzzle

# Builds the day's puzzle from the latest GOES GeoColor frames, writes the answers to
# Cloudflare KV, then deploys the static site to Cloudflare Pages.
# Setup steps: docs/DEPLOY.md

on:
  schedule:
    - cron: "0 17 * * *" # 17:00 UTC (11am Denver). Players roll over to it at 18:00 UTC.
  workflow_dispatch:
    inputs:
      date:
        description: "Puzzle date label, YYYY-MM-DD (default: the current game day)"
        required: false
      at:
        description: "Use frames at/before this UTC time, e.g. 2026-10-16T17:00 (default: newest). Handy when running at night."
        required: false

concurrency:
  group: daily-puzzle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
      D1_ID: ${{ vars.CF_D1_DATABASE_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      SITE_URL: ${{ vars.SITE_URL }}
      IN_DATE: ${{ inputs.date }}
      IN_AT: ${{ inputs.at }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Check config
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID KV_ID D1_ID PROJECT; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see docs/DEPLOY.md)"; exit 1; fi
          done
          if [ -n "$IN_DATE" ] && ! [[ "$IN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD"; exit 1
          fi
          if [ -n "$IN_AT" ] && ! [[ "$IN_AT" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}T)?[0-9]{2}:[0-9]{2}$ ]]; then
            echo "::error::at must be HH:MM or YYYY-MM-DDTHH:MM (UTC)"; exit 1
          fi

      - name: Tests
        run: |
          python -m pytest -q tests
          npm test

      - name: Fetch satellite frames (GOES-East, GOES-West, Meteosat)
        run: |
          args=()
          [ -n "$IN_AT" ] && args+=(--at "$IN_AT")
          python -m sattap.cli fetch "${args[@]}"

      - name: Build puzzle
        run: |
          args=()
          [ -n "$IN_DATE" ] && args+=(--date "$IN_DATE")
          [ -n "$IN_AT" ] && args+=(--at "$IN_AT")
          python -m sattap.cli build "${args[@]}" > /dev/null

      - name: Assemble site and answers
        run: |
          args=()
          [ -n "$SITE_URL" ] && args+=(--site-url "$SITE_URL")
          python tools/publish.py "${args[@]}"

      - name: Fill in Cloudflare ids
        run: |
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$KV_ID/; s/REPLACE_WITH_D1_DATABASE_ID/$D1_ID/" wrangler.toml

      # Leaderboard tables. Idempotent: only unapplied migrations in migrations/ run.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply sattap --remote

      # Answers first: a puzzle must never be live without its answers.
      - name: Write answers to Workers KV
        run: npx wrangler kv bulk put build/kv.json --namespace-id "$KV_ID" --remote

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
